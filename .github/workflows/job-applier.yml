name: Automated Job Application Bot

# Schedule to run daily at 9 AM IST (3:30 AM UTC)
on:
  schedule:
    - cron: '30 3 * * *'  # Daily at 9 AM IST (Mon-Sun)
  workflow_dispatch:  # Allow manual trigger

jobs:
  apply-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data_folder/secrets.yaml from GitHub Actions secret
        run: |
          mkdir -p data_folder
          cat > data_folder/secrets.yaml << EOF
          llm_api_key: '${{ secrets.ai_api_key }}'
          EOF

      - name: Run Job Applier Bot
        run: |
          python main.py
        env:
          # Groq API key from GitHub Actions secret
          GROQ_API_KEY: ${{ secrets.ai_api_key }}

      - name: Upload job applications log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: job-applications
          path: job_applications/
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs
          path: logs/
          retention-days: 7
